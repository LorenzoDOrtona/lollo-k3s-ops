apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: slskd
spec:
  selector:
    matchLabels:
      app: slskd
  template:
    metadata:
      labels:
        app: slskd
    spec:
      initContainers:
      - name: init-config
        image: alpine:latest
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /config
          touch /config/slskd.yml
          if ! grep -q "lidarr-secret-key-1234" /config/slskd.yml; then
            echo -e "\nweb:\n  authentication:\n    api_keys:\n      lidarr:\n        key: \"lidarr-secret-key-1234\"" >> /config/slskd.yml
          fi
          if ! grep -q "lollo-k3s-ops" /config/slskd.yml; then
            echo -e "\nsoulseek:\n  username: \"lollo-k3s-ops\"\n  password: \"lidarr-secret-key-1234\"" >> /config/slskd.yml
          fi
          if ! grep -q "downloads: /music" /config/slskd.yml; then
            echo -e "\ndirectories:\n  downloads: /music" >> /config/slskd.yml
          fi
          chown -R 1000:1000 /music || true
        volumeMounts:
        - name: slskd-config
          mountPath: /config
        - name: media-storage
          mountPath: /music
      containers:
      # Gluetun VPN Container
      - name: gluetun
        image: qmcgaw/gluetun
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        envFrom:
          - secretRef:
              name: gluetun-secret
        env:
          - name: TZ
            value: "Europe/Rome"
          - name: FIREWALL_OUTBOUND_SUBNETS
            value: "10.42.0.0/16,10.43.0.0/16"
        ports:
          - containerPort: 5030
            name: http
          - containerPort: 50300
            name: soulseek
            
      # slskd Container
      - name: slskd
        image: slskd/slskd:latest
        envFrom:
          - secretRef:
              name: slskd-credentials
        env:
        - name: SLSKD_REMOTE_CONFIGURATION
          value: "true"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Rome"
        volumeMounts:
        - name: slskd-config
          mountPath: /app
        - name: media-storage
          mountPath: /music
      volumes:
      - name: media-storage
        hostPath:
          path: /mnt/das-storage/slskd/downloads
      - name: slskd-config
        hostPath:
          path: /mnt/das-storage/slskd/config
---
apiVersion: v1
kind: Service
metadata:
  name: slskd-service
  namespace: slskd
spec:
  selector:
    app: slskd
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 5030
    - name: soulseek
      protocol: TCP
      port: 50300
      targetPort: 50300
