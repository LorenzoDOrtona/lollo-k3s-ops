apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunshine
  namespace: sunshine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunshine
  # Recreate è obbligatorio con hostNetwork: true — il rolling update
  # causerebbe FailedScheduling perché le porte host sono già occupate dal vecchio pod.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sunshine
    spec:
      # hostNetwork è necessario per i pacchetti UDP dello streaming Moonlight.
      # Sunshine usa porte UDP 47998-48000 per video/audio/control che non
      # funzionano correttamente dietro NAT di Kubernetes senza hostNetwork.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      initContainers:
      # Corregge i permessi di /dev/uinput prima che Sunshine parta.
      # uinput di default è root:input mode 0660; Sunshine gira come utente lizard (UID 1000).
      - name: uinput-chmod
        image: busybox:1.36
        command: ["sh", "-c", "chmod 0666 /dev/uinput"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: uinput
          mountPath: /dev/uinput
      # Il PVC config è owned da root, ma Sunshine gira come lizard (UID 1000).
      # Questo initContainer fa chown in modo che Sunshine possa scrivere la sua config.
      - name: config-chown
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 1000:1000 /home/lizard/.config/sunshine"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: config
          mountPath: /home/lizard/.config/sunshine

      containers:
      # --- Sidecar: Xvfb virtual display ---
      # Avvia un X server virtuale su :99 (1920x1080 24bpp).
      # Sunshine lo trova tramite la variabile DISPLAY=:99 impostata nel container principale.
      # Il socket X è condiviso tra i due container tramite il volume xsocket.
      - name: xvfb
        image: docker.io/alpine:3.20
        command:
        - sh
        - -c
        - |
          apk add --no-cache xvfb && \
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
        securityContext:
          privileged: true
        volumeMounts:
        - name: xsocket
          mountPath: /tmp/.X11-unix

      # --- Container principale: Sunshine ---
      - name: sunshine
        # lizardbyte/sunshine è l'immagine ufficiale upstream (LizardByte team).
        image: docker.io/lizardbyte/sunshine:latest-ubuntu-24.04
        securityContext:
          privileged: true
        env:
        - name: TZ
          value: "Europe/Rome"
        # Punta al display virtuale avviato dal sidecar Xvfb
        - name: DISPLAY
          value: ":99"

        ports:
        # Web UI (accessibile via Tailscale ingress)
        - containerPort: 47990
          name: webui
          protocol: TCP
        # HTTPS stream handshake
        - containerPort: 47984
          name: https
          protocol: TCP
        # HTTP
        - containerPort: 47989
          name: http
          protocol: TCP
        # RTSP
        - containerPort: 48010
          name: rtsp
          protocol: TCP
        # Video/Audio/Control UDP (Moonlight li usa per lo stream)
        - containerPort: 47998
          name: video
          protocol: UDP
        - containerPort: 47999
          name: control
          protocol: UDP
        - containerPort: 48000
          name: audio
          protocol: UDP

        volumeMounts:
        # lizardbyte/sunshine legge la config da /home/lizard/.config/sunshine
        - name: config
          mountPath: /home/lizard/.config/sunshine
        - name: roms
          mountPath: /roms
        # Intel iGPU per VAAPI hardware encoding (H.264/HEVC)
        - name: dri
          mountPath: /dev/dri
        # uinput per emulare gamepad/mouse/tastiera virtuali verso Moonlight
        - name: uinput
          mountPath: /dev/uinput
        # Socket X condiviso con il sidecar Xvfb
        - name: xsocket
          mountPath: /tmp/.X11-unix
        # Shared memory dedicata per video capture ad alte performance
        - name: shm
          mountPath: /dev/shm

        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "4000m"
            memory: "4Gi"

      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sunshine-config-pvc
      - name: roms
        persistentVolumeClaim:
          claimName: sunshine-roms-pvc
      # /dev/dri: Intel HD 530 iGPU per VAAPI (encoding H.264/HEVC)
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      # /dev/uinput: input virtuale per gamepad Moonlight
      - name: uinput
        hostPath:
          path: /dev/uinput
          type: CharDevice
      # Socket X condiviso tra Xvfb e Sunshine
      - name: xsocket
        emptyDir: {}
      # /dev/shm: shared memory dedicata (non condivide quella dell'host)
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
---
# Service solo per la Web UI (47990/TCP) — lo streaming UDP
# bypassa il Service perché usiamo hostNetwork: true
apiVersion: v1
kind: Service
metadata:
  name: sunshine-webui
  namespace: sunshine
spec:
  selector:
    app: sunshine
  ports:
    - protocol: TCP
      port: 47990
      targetPort: 47990
      name: webui
