apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunshine
  namespace: sunshine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunshine
  # Recreate è obbligatorio con hostNetwork: true — il rolling update
  # causerebbe FailedScheduling perché le porte host sono già occupate dal vecchio pod.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sunshine
    spec:
      # hostNetwork è necessario per i pacchetti UDP dello streaming Moonlight.
      # Sunshine usa porte UDP 47998-48000 per video/audio/control che non
      # funzionano correttamente dietro NAT di Kubernetes senza hostNetwork.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      initContainers:
      # Corregge i permessi di /dev/uinput prima che Sunshine parta.
      # uinput di default è root:input mode 0660; Sunshine gira come utente lizard (UID 1000).
      - name: uinput-chmod
        image: busybox:1.36
        command: ["sh", "-c", "chmod 0666 /dev/uinput"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: uinput
          mountPath: /dev/uinput

      containers:
      - name: sunshine
        # lizardbyte/sunshine: immagine ufficiale upstream, pubblica su Docker Hub — no auth.
        # Usa capture=kms per catturare il framebuffer Intel iGPU via /dev/dri
        # senza bisogno di X11/Xvfb (che richiederebbe libXrandr non inclusa nell'immagine).
        image: docker.io/lizardbyte/sunshine:latest-ubuntu-24.04
        # Inietta capture=kms nella config prima di avviare Sunshine.
        # KMS usa il DRM subsystem direttamente, non richiede display server.
        command:
        - sh
        - -c
        - |
          mkdir -p /home/lizard/.config/sunshine
          cat > /home/lizard/.config/sunshine/sunshine.conf <<'EOF'
          capture=kms
          EOF
          exec sunshine
        securityContext:
          privileged: true
          # runAsUser: 0 perché fsGroup non si applica ai volumi hostPath su k3s.
          runAsUser: 0
        env:
        - name: TZ
          value: "Europe/Rome"
        - name: XDG_RUNTIME_DIR
          value: "/tmp/runtime-root"

        ports:
        - containerPort: 47990
          name: webui
          protocol: TCP
        - containerPort: 47984
          name: https
          protocol: TCP
        - containerPort: 47989
          name: http
          protocol: TCP
        - containerPort: 48010
          name: rtsp
          protocol: TCP
        - containerPort: 47998
          name: video
          protocol: UDP
        - containerPort: 47999
          name: control
          protocol: UDP
        - containerPort: 48000
          name: audio
          protocol: UDP

        volumeMounts:
        - name: config
          mountPath: /home/lizard/.config/sunshine
        - name: roms
          mountPath: /roms
        # Intel iGPU per VAAPI hardware encoding e KMS capture
        - name: dri
          mountPath: /dev/dri
        # uinput per emulare gamepad/mouse/tastiera virtuali verso Moonlight
        - name: uinput
          mountPath: /dev/uinput
        # Shared memory dedicata per video capture
        - name: shm
          mountPath: /dev/shm

        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "4000m"
            memory: "4Gi"

      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sunshine-config-pvc
      - name: roms
        persistentVolumeClaim:
          claimName: sunshine-roms-pvc
      # /dev/dri: Intel HD 530 iGPU per VAAPI encoding e KMS capture
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      # /dev/uinput: input virtuale per gamepad Moonlight
      - name: uinput
        hostPath:
          path: /dev/uinput
          type: CharDevice
      # /dev/shm: shared memory dedicata
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
---
# Service solo per la Web UI (47990/TCP)
apiVersion: v1
kind: Service
metadata:
  name: sunshine-webui
  namespace: sunshine
spec:
  selector:
    app: sunshine
  ports:
    - protocol: TCP
      port: 47990
      targetPort: 47990
      name: webui
