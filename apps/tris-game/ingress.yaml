apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: tris-game
  annotations:
    # Expose this service publicly on the internet via Tailscale Funnel.
    # Anyone can access it without being on the Tailscale network.
    # The real server IP remains hidden behind Tailscale's infrastructure.
    tailscale.com/funnel: "true"
    # Link this Ingress to the ProxyGroup that manages the proxy pods.
    # Required by Tailscale Operator >= v1.78.
    tailscale.com/proxy-group: "ingress-proxies"
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - tris-game
  rules:
  - host: tris-game
    http:
      paths:
      # Routes backend API requests to the Go service
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      # Routes all other traffic to the React frontend service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
