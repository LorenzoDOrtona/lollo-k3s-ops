apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  namespace: tris-game
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - tris-game
  rules:
  - host: tris-game
    http:
      paths:
      # Routes backend API requests to the Go service
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      # Routes all other traffic to the React frontend service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
