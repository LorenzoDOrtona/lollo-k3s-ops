---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  type: oci
  url: oci://code.forgejo.org/forgejo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: forgejo
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: forgejo
  releaseName: forgejo
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Disable built-in ingress as we manage it via a separate file using tailscale
    ingress:
      enabled: false

    # Ensure mounted storage has correct permissions for rootless container
    securityContext:
      fsGroup: 1000

    # Disable PostgreSQL and Redis to use built-in SQLite for simplicity
    postgresql:
      enabled: false
    redis:
      enabled: false

    # Expose SSH service via NodePort so git@...:30022 works
    service:
      ssh:
        type: NodePort
        nodePort: 30022

    gitea:
      # Inject the admin credentials from the SOPS encrypted secret
      admin:
        existingSecret: forgejo-admin-secret
        email: forgejo-admin@local.domain

      # Configure Forgejo settings (equivalent to app.ini)
      config:
        database:
          DB_TYPE: sqlite3
        server:
          ROOT_URL: "https://forgejo.tail888a9f.ts.net/"
          DOMAIN: "forgejo.tail888a9f.ts.net"
          HTTP_PORT: "3000"
          SSH_PORT: "30022"
          SSH_LISTEN_PORT: "2222"
