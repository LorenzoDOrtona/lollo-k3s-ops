# 1. VOLUME AND CLAIM FOR SEAFILE DATA (1 TB)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seafile-data-pv
spec:
  capacity:
    storage: 300Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: das-storage
  hostPath:
    path: /mnt/das-storage/seafile/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-data
  namespace: seafile
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: das-storage
  volumeName: seafile-data-pv
  resources:
    requests:
      storage: 300Gi
---
# 2. VOLUME AND CLAIM FOR DATABASE (MariaDB / MySQL)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seafile-db-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: das-storage
  hostPath:
    path: /mnt/das-storage/seafile/db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-db-pvc
  namespace: seafile
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: das-storage
  volumeName: seafile-db-pv
  resources:
    requests:
      storage: 10Gi
