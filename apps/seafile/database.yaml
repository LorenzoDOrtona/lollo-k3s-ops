# 1. MARIADB DATABASE DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-mariadb
  namespace: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile-mariadb
  template:
    metadata:
      labels:
        app: seafile-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.11
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secret
                  key: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              value: seafile
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-secret
                  key: SEAFILE_MYSQL_DB_PASSWORD
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: seafile-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seafile-mariadb
  namespace: seafile
spec:
  selector:
    app: seafile-mariadb
  ports:
    - port: 3306
      targetPort: 3306
---
# 2. REDIS CACHE DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-redis
  namespace: seafile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seafile-redis
  template:
    metadata:
      labels:
        app: seafile-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: seafile-redis
  namespace: seafile
spec:
  selector:
    app: seafile-redis
  ports:
    - port: 6379
      targetPort: 6379
