apiVersion: batch/v1
kind: CronJob
metadata:
  name: music-tagger
  namespace: music-server
spec:
  schedule: "0 2 * * *" # Every day at 2 AM
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - navidrome
                topologyKey: "kubernetes.io/hostname"
          containers:
          - name: tagger
            image: python:3.9-slim
            command:
            - /bin/sh
            - -c
            - |
              apt-get update && apt-get install -y ffmpeg chromaprint-tools
              pip install requests musicbrainzngs mutagen acoustid Pillow
              python /app/tagger-script.py
            volumeMounts:
            - name: music-data
              mountPath: /music
            - name: script
              mountPath: /app/tagger-script.py
              subPath: tagger-script.py
          volumes:
          - name: music-data
            persistentVolumeClaim:
              claimName: music-pvc
          - name: script
            configMap:
              name: music-tagger-script
          restartPolicy: OnFailure
