apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: flux-system
spec:
  targetNamespace: immich
  interval: 1h
  chart:
    spec:
      chart: immich
      version: "0.8.2" # VERSIONE BLOCCATA (Pinning) per proteggere il server da breaking changes automatiche
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: flux-system
  values:
    env:
      REDIS_HOSTNAME: '{{ .Release.Name }}-redis-master'
      DB_DATABASE_NAME: immich
      DB_USERNAME: postgres
      DB_HOSTNAME: '{{ .Release.Name }}-postgresql'
    envFrom:
      - secretRef:
          name: immich-secret
          
    # Diciamo al Server e Microservizi Immich di agganciarsi al PVC sul disco DAS
    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc
          
    # Configurazione di PostgreSQL (con estensione pgvecto-rs) collegato al PVC sul disco DAS
    postgresql:
      enabled: true
      image:
        repository: tensorchord/pgvecto-rs
        tag: pg14-v0.2.0
      persistence:
        enabled: true
        existingClaim: immich-postgres-pvc
        
    redis:
      enabled: true
      architecture: standalone
