apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  targetNamespace: immich
  interval: 1h
  chart:
    spec:
      chart: immich
      version: "0.13.1" # LOCKED VERSION (Pinning) to protect the server from automatic breaking changes
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: immich
  values:
    env:
      REDIS_HOSTNAME: '{{ .Release.Name }}-valkey'
      DB_DATABASE_NAME: immich
      DB_USERNAME: postgres
      DB_HOSTNAME: '{{ .Release.Name }}-postgres'
    envFrom:
      - secretRef:
          name: immich-secret
          
    # Tell Immich Server and Microservices to attach to the PVC on the DAS disk
    immich:
      persistence:
        library:
          existingClaim: immich-library-pvc
          
    valkey:
      enabled: true
