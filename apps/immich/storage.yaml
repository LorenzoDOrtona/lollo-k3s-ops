# 1. VOLUME AND CLAIM FOR PHOTOS/VIDEOS (Media Library)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-library-pv
spec:
  capacity:
    storage: 700Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: das-storage
  hostPath:
    path: /mnt/das-storage/immich/library
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: das-storage
  resources:
    requests:
      storage: 700Gi
---
# 2. VOLUME AND CLAIM FOR POSTGRESQL DATABASE
apiVersion: v1
kind: PersistentVolume
metadata:
