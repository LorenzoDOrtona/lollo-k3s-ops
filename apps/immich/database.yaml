# 1. Deploy the PostgreSQL container
# NOTE: bridge image containing BOTH the legacy pgvecto-rs extension and the new
# VectorChord/pgvector extensions. Needed because Immich v3 dropped pgvecto-rs
# support and this DB's existing tables/indexes still use pgvecto-rs types.
# Immich will auto-migrate & reindex on first boot against this image.
# Once you see "Reindexed clip_index" / "Reindexed face_index" in the immich-server
# logs, you can optionally switch to the leaner ghcr.io/immich-app/postgres:14-vectorchord0.4.3
# (drops pgvecto-rs) for a smaller image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secret
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_INITDB_ARGS
              value: '--data-checksums'
          ports:
            - containerPort: 5432
          volumeMounts:
            # Mount the persistent storage to the database data folder
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: immich-postgres-pvc
---
# 2. Create an internal network address for the database
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector:
    app: immich-postgres
  ports:
    - port: 5432
      targetPort: 5432
